<!DOCTYPE html>
<html>
<head>
  <title>My Valentine ❤️</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Poppins', sans-serif;
      background: #ffe6eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
       display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 320px;
    }
    img {
      width: 200px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 10px;
    }
    .yes {
      background: #ff4d6d;
      color: white;
    }
    .no {
      background: #ddd;
    }
    .love-bg {
  background-image: url('SRNU7840.JPG');
  background-size: cover;
  background-position: center;
  color: white;
}

#buttons {
  position: relative;
  height: 60px;
}
.card {
  user-select: none;
}
    body.love-bg {
  background-image: url('SRNU7840.JPG');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

body.love-bg::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: -1;
}


/* Glass message box */
.love-message {
  display: none;
  position: relative;
  z-index: 2;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  padding: 20px 25px;
  border-radius: 16px;
  color: #fff;
  animation: fadeIn 1s ease-in-out;
}

.love-message h2 {
  margin-bottom: 10px;
}
    .love-message h2 {
  font-size: 26px;
  margin-bottom: 10px;
}

.love-message p {
  font-size: 16px;
  line-height: 1.5;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
.card {
  /* width: 320px;
  height: 420px; */
  user-select: none;
}
.love-bg::before {
  background: rgba(0, 0, 0, 0.25);
}
    .card {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 24px;
  padding: 30px 35px;
  box-shadow: 
    0 20px 40px rgba(0, 0, 0, 0.4),
    0 0 40px rgba(255, 105, 135, 0.35);
  max-width: 320px;
  text-align: center;
  animation: popIn 0.8s ease-out;
}
@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
.heart {
  position: absolute;
  font-size: 22px;
  animation: floatUp 4s ease-in-out infinite;
  opacity: 0.8;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    transform: translateY(-120px) scale(1.4);
    opacity: 0;
  }
}

  </style>
</head>

<body>
  <div class="card" id="card">
  <h2 id="question">Bhargavi, will you be my Valentine? ❤️</h2>

  <div id="buttons">
    <button class="yes" onclick="showLove()">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

 <div id="msg" class="love-message">
  <h2>💖 Yayyy!</h2>
  <p>I knew you’d say YES 😍</p>
  <p>You’re my Valentine today,<br>tomorrow & forever ❤️</p>
</div>
</div>


  <script>
  const noBtn = document.getElementById("noBtn");

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 80 - 40;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  });

  function showLove() {
    const card = document.getElementById("card");
    document.getElementById("question").style.display = "none";
    document.getElementById("buttons").style.display = "none";

    document.body.classList.add("love-bg");
    document.getElementById("msg").style.display = "inline-block";
  }
    setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 80 + "%";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 4000);
}, 600);

</script>

</body>
</html>
