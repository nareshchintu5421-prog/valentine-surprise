<!DOCTYPE html>
<html>
<head>
  <title>My Valentine ❤️</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffe6eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 320px;
    }
    img {
      width: 200px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 10px;
    }
    .yes {
      background: #ff4d6d;
      color: white;
    }
    .no {
      background: #ddd;
    }
    .love-bg {
  background-image: url('SRNU7840.JPG');
  background-size: cover;
  background-position: center;
  color: white;
}

#buttons {
  position: relative;
  height: 60px;
}
.card {
  user-select: none;
}
  </style>
</head>

<body>
  <div class="card" id="card">
  <h2 id="question">Bhargavi, will you be my Valentine? ❤️</h2>

  <div id="buttons">
    <button class="yes" onclick="showLove()">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

  <p id="msg" style="display:none; font-size:20px; margin-top:20px; color:white;">
    💖 Yayyy! <br>
    I knew you’d say YES 😍 <br>
    You’re my Valentine today, tomorrow & forever ❤️
  </p>
</div>


  <script>
  const noBtn = document.getElementById("noBtn");

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 80 - 40;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  });

  function showLove() {
    const card = document.getElementById("card");
    document.getElementById("question").style.display = "none";
    document.getElementById("buttons").style.display = "none";

    card.classList.add("love-bg");
    document.getElementById("msg").style.display = "block";
  }
</script>

</body>
</html>
