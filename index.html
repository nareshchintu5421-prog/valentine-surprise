<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Valentine ❤️</title>

  <style>
    /* ===== BASE ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
  font-family: 'Segoe UI', 'Poppins', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #ffe6eb;
  overflow: hidden;
    }

    body.love-bg {
      background: url('SRNU7840.JPG') center / cover no-repeat fixed;
    }

    /* Dark overlay */
    body.love-bg::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    /* Vignette */
    body.love-bg::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(
    circle at 30% center,
    transparent 35%,
    rgba(0,0,0,0.6) 100%
  );
  pointer-events: none;
  z-index: 2;
}


    /* ===== CARD ===== */
    .card {
      position: relative;
      z-index: 5;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 26px;
      padding: 32px 36px;
      max-width: 340px;
      text-align: center;
      box-shadow:
        0 25px 45px rgba(0, 0, 0, 0.45),
        0 0 50px rgba(255, 90, 120, 0.35);
      animation: popIn 0.8s ease-out;
      user-select: none;
      position: relative;
  transform: none !important;
right: -28%;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    h2 {
      margin-bottom: 20px;
      color: #fff;
    }

    #buttons {
      height: 60px;
      position: relative;
    }

    button {
      padding: 10px 26px;
      font-size: 16px;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      margin: 8px;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #ddd;
    }

    /* ===== LOVE MESSAGE ===== */
    .love-message {
      display: none;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 22px 26px;
      color: #fff;
      animation: fadeIn 1s ease;
    }

    .love-message h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .love-message p {
      font-size: 16px;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== HEARTS ===== */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 22px;
      animation: floatUp 5s linear infinite;
      opacity: 0.85;
      z-index: 3;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.4);
        opacity: 0;
      }
    }
  @media (max-width: 767px) {
  body.love-bg .card {
    transform: translateX(40px);
  }
}

    .card h2 {
  color: #333;   /* dark text */
}
button {
  color: #333;
}

/* Move card slightly right ONLY after YES */
body.love-bg .card {
  transform: translateX(160px);
  transition: transform 0.6s ease;
}

/* Default state: perfectly centered */
.card {
  transform: translateX(0);
  transition: transform 0.6s ease;
}
    /* Default – centered */
.card {
  transform: translateX(0);
  transition: transform 0.6s ease;
}

/* /* After YES – desktop */
body.love-bg .card {
  transform: translateX(120px);
} */

/* After YES – MOBILE (FORCE MOVE RIGHT) */
@media (max-width: 767px) {
  body.love-bg .card {
    transform: translateX(15vw) !important;
  }
}
    /* Default: center */
body {
  justify-content: center;
}

/* /* After YES: move card right on MOBILE */
@media (max-width: 767px) {
  body.love-bg {
    justify-content: flex-start;
    padding-left: 15vw;
  }
} */

/* DEFAULT: card centered */
.card {
  position: relative;
}

/* MOBILE: move card to right-top AFTER YES */
@media (max-width: 767px) {
  body.love-bg .card {
    position: fixed;
    top: 18%;
    right: 8%;
    transform: none;
    transition: all 0.6s ease;
  }
}

  </style>
</head>

<body>

  <div class="card" id="card">
    <h2 id="question">Bhargavi, will you be my Valentine? ❤️</h2>

    <div id="buttons">
      <button class="yes" onclick="showLove()">Yes</button>
      <button class="no" id="noBtn">No</button>
    </div>

    <div id="msg" class="love-message">
      <h2>💖 Yayyy!</h2>
      <p>I knew you’d say YES 😍</p>
      <p>You’re my Valentine today,<br>tomorrow & forever ❤️</p>
    </div>
  </div>

  <script>
    /* NO button escape 😄 */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 80 - 40;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    /* YES action */
    function showLove() {
      document.body.classList.add("love-bg");
  document.getElementById("question").style.display = "none";
  document.getElementById("buttons").style.display = "none";
  document.getElementById("msg").style.display = "block";
    }

    /* Floating hearts */
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 700);
  </script>

</body>
</html>
